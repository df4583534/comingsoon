<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cloud &amp; it flow</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
  // glyph pool: half-width katakana, digits, and IT-ish symbols
  const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789{}<>/\\|#$%&*+=?";
  const randGlyph = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W, H, dpr, fs, cw, lh, rows = [];

  function init() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    fs = Math.max(9, Math.min(11, W / 110));
    ctx.font = `500 ${fs}px "Courier New", ui-monospace, Menlo, Consolas, monospace`;
    ctx.textBaseline = "top";
    cw = ctx.measureText("m").width;
    lh = fs * 1.05;

    const rowCount = Math.ceil(H / lh) + 1;
    rows = [];
    for (let r = 0; r < rowCount; r++) {
      rows.push({
        y: r * lh,
        baseSpeed: 60 + Math.random() * 90,
        spawnChance: 0.03 + Math.random() * 0.05,
        streams: []
      });
    }
  }

  function canSpawn(row) {
    return row.streams.every(s => s.x - s.len * cw > 3 * cw);
  }

  function spawn(row) {
    const len = 14 + Math.floor(Math.random() * 28);
    const chars = Array.from({ length: len }, randGlyph);
    row.streams.push({
      x: -len * cw,
      speed: row.baseSpeed * (0.9 + Math.random() * 0.2),
      len,
      chars
    });
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    for (const row of rows) {
      if (row.streams.length < 14 && Math.random() < row.spawnChance * 2 && canSpawn(row)) spawn(row);

      for (const s of row.streams) {
        s.x += s.speed * dt;

        // garble: swap a few glyphs every frame so the text never settles
        for (let k = 0; k < 2; k++) {
          if (Math.random() < 0.6) s.chars[(Math.random() * s.len) | 0] = randGlyph();
        }

        for (let i = 0; i < s.len; i++) {
          const px = s.x - i * cw;
          if (px < -cw || px > W + cw) continue;
          const ch = s.chars[s.len - 1 - i];

          if (i === 0) {
            ctx.shadowColor = "#fff";
            ctx.shadowBlur = 10;
            ctx.fillStyle = "#fff";
          } else {
            ctx.shadowBlur = 0;
            const a = 0.3 + 0.7 * (1 - i / s.len);
            ctx.fillStyle = `rgba(255, 255, 255, ${a.toFixed(3)})`;
          }
          ctx.fillText(ch, px, row.y);
        }
      }
      ctx.shadowBlur = 0;

      row.streams = row.streams.filter(s => s.x - s.len * cw < W + cw);
    }
    requestAnimationFrame(frame);
  }

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(init, 150);
  });

  init();
  requestAnimationFrame(frame);
</script>
</body>
</html>
