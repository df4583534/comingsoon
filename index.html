<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title>partner cloud</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b0b0f; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #root { width: 100%; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.0/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useEffect, useRef } = React;

// Stand-in for ./ASCIIText. Accepts the same props as the snippet.
// Replace this function with your real ASCIIText component if you have it.
function ASCIIText({
  text,
  asciiFontSize = 8,
  colors = ['#ffffff'],
  waves = 1,
  waveSpeed = 1,
  scramble = 0.6,
  clickRipple = false,
  idle = false,
  interactive = false,
}) {
  const ref = useRef(null);

  useEffect(() => {
    const canvas = ref.current;
    const ctx = canvas.getContext('2d');
    const off = document.createElement('canvas');
    const octx = off.getContext('2d', { willReadFrequently: true });
    const RAMP = ' .:-=+*#%@';
    const RGB = colors.map(h => {
      const n = parseInt(h.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    });
    const gradient = t => {
      const f = (((t % 1) + 1) % 1) * (RGB.length - 1);
      const i = Math.floor(f), k = f - i;
      const a = RGB[i], b = RGB[Math.min(i + 1, RGB.length - 1)];
      return `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * k)).join(',')})`;
    };

    const ripples = [];
    const pointer = { x: 0, y: 0, on: false, t: -10 };
    let W = 0, H = 0, dpr = 1, cellW = 1, cellH = 1, cells = [];
    let lastIdle = 0, raf = 0;

    const layout = () => {
      const rect = canvas.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      cellW = asciiFontSize * 0.6;
      cellH = asciiFontSize;
      off.width = Math.ceil(W);
      off.height = Math.ceil(H);

      let size = 200;
      octx.font = `900 ${size}px Arial, Helvetica, sans-serif`;
      size = Math.min(size * (W * 0.85) / octx.measureText(text).width, H * 0.4);
      octx.font = `900 ${size}px Arial, Helvetica, sans-serif`;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillStyle = '#fff';
      octx.clearRect(0, 0, off.width, off.height);
      octx.fillText(text, W / 2, H / 2);
      const data = octx.getImageData(0, 0, off.width, off.height).data;

      cells = [];
      const cols = Math.ceil(W / cellW), rows = Math.ceil(H / cellH);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = (c + 0.5) * cellW, y = (r + 0.5) * cellH;
          const px = Math.floor(x), py = Math.floor(y);
          if (px >= off.width || py >= off.height) continue;
          const a = data[(py * off.width + px) * 4 + 3] / 255;
          if (a > 0.05) cells.push({ c, r, x, y, a });
        }
      }
    };

    const spawn = (x, y, now) => ripples.push({ x, y, t0: now });

    const onMove = e => {
      const rect = canvas.getBoundingClientRect();
      pointer.x = e.clientX - rect.left;
      pointer.y = e.clientY - rect.top;
      pointer.on = true;
      pointer.t = performance.now() / 1000;
    };
    const onLeave = () => { pointer.on = false; };
    const onDown = e => {
      const rect = canvas.getBoundingClientRect();
      spawn(e.clientX - rect.left, e.clientY - rect.top, performance.now() / 1000);
    };

    if (interactive) {
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerleave', onLeave);
    }
    if (clickRipple) canvas.addEventListener('pointerdown', onDown);

    const frame = ms => {
      const now = ms / 1000;
      ctx.fillStyle = '#0b0b0f';
      ctx.fillRect(0, 0, W, H);
      ctx.font = `${asciiFontSize}px "Courier New", Consolas, monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (idle && now - lastIdle > 3.5) {
        spawn(W * (0.2 + Math.random() * 0.6), H * (0.35 + Math.random() * 0.3), now);
        lastIdle = now;
      }
      for (let i = ripples.length - 1; i >= 0; i--) {
        if (now - ripples[i].t0 > 4) ripples.splice(i, 1);
      }

      const pointerOn = interactive && pointer.on && now - pointer.t < 1.5;

      for (const cell of cells) {
        let bright = cell.a;

        const wave =
          Math.sin(cell.c * 0.12 + now * 2 * waveSpeed) * 0.5 +
          Math.sin(cell.r * 0.3 - now * 1.3 * waveSpeed) * 0.5;
        bright *= 0.75 + 0.25 * wave * waves;

        let ripple = 0;
        for (const rp of ripples) {
          const age = now - rp.t0;
          const d = Math.hypot(cell.x - rp.x, cell.y - rp.y);
          const dd = (d - age * 160) / 18;
          ripple += Math.exp(-dd * dd) * Math.exp(-age * 1.5);
        }
        bright += ripple * 0.6;

        let near = 0;
        if (pointerOn) {
          near = Math.max(0, 1 - Math.hypot(cell.x - pointer.x, cell.y - pointer.y) / 120);
        }

        const chance = scramble * (0.08 + near * 0.9 + Math.min(ripple, 1) * 0.6);
        let idx = Math.floor(Math.min(Math.max(bright, 0), 1) * (RAMP.length - 1));
        if (Math.random() < chance) idx = Math.floor(Math.random() * RAMP.length);

        const ch = RAMP[idx];
        if (ch === ' ') continue;
        ctx.fillStyle = gradient(cell.x / W * 0.5 + now * 0.05);
        ctx.fillText(ch, cell.x, cell.y);
      }

      raf = requestAnimationFrame(frame);
    };

    const ro = new ResizeObserver(layout);
    ro.observe(canvas);
    layout();
    raf = requestAnimationFrame(frame);

    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      canvas.removeEventListener('pointermove', onMove);
      canvas.removeEventListener('pointerleave', onLeave);
      canvas.removeEventListener('pointerdown', onDown);
    };
  }, [text, asciiFontSize, colors.join(','), waves, waveSpeed, scramble, clickRipple, idle, interactive]);

  return (
    <canvas
      ref={ref}
      style={{
        position: 'absolute',
        inset: 0,
        width: '100%',
        height: '100%',
        display: 'block',
        cursor: interactive ? 'crosshair' : 'default',
      }}
    />
  );
}

function App() {
  return (
    <div style={{ position: 'relative', width: '100%', height: 440 }}>
      <ASCIIText
        text="Under construction"
        asciiFontSize={8}
        colors={['#1e3a8a', '#3b82f6', '#93c5fd']}
        textScale={1}
        blocks={0.9}
        waves={1}
        waveSpeed={1}
        chroma={1}
        tilt={1}
        hueShift={1}
        scramble={0.6}
        clickRipple
        idle
        interactive
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
